<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم صبا</title>
<style>
body{font-family:Arial;background:#f8f1ed;padding:20px;color:#513b35}
h1{color:#a66d68}
input,textarea,button{display:block;width:100%;padding:12px;margin:10px 0;box-sizing:border-box;border:1px solid #d8b9ae;border-radius:10px}
button{background:#a66d68;color:white;font-weight:bold;border:0}
</style>
</head>
<body>
<h1>لوحة تحكم صبا 🌸</h1>
<p>تعديل معلومات الخدمات</p>
<label>اسم الخدمة</label>
<input id="title" placeholder="مثلاً: تنظيف البشرة">
<label>الوصف</label>
<textarea id="description" placeholder="اكتبي وصف الخدمة"></textarea>
<label>السعر</label>
<input id="price" placeholder="السعر">
<button onclick="alert('تم تجهيز البيانات. ربط الحفظ بالموقع يحتاج خطوة إضافية.')">حفظ</button>
</body>
</html>
