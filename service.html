const content={
"wax-hair-removal":{title:"إزالة الشعر بالشمع",intro:"جلسة لإزالة الشعر من المنطقة المطلوبة باستخدام الشمع المناسب، مع الاهتمام بنظافة البشرة وراحتها قبل الجلسة وبعدها.",sections:[["كيف تتم الجلسة؟","نبدأ بتنظيف المنطقة وتجفيفها، ثم تتم إزالة الشعر بالشمع بطريقة مناسبة للمنطقة، وتُختتم الجلسة بعناية مهدئة بحسب حاجة البشرة."],["قبل الجلسة","يفضّل أن تكون البشرة نظيفة وجافة. أخبرينا إذا كانت بشرتك حساسة أو تستخدمين منتجات تقشير، حتى نراعي ذلك عند تحديد الموعد."],["بعد الجلسة","قد يظهر احمرار خفيف ومؤقت. يُفضّل تجنّب الحرارة العالية والاحتكاك والعطور على المنطقة لفترة قصيرة، واتباع إرشادات المختصة."],["متى نؤجل الجلسة؟","إذا كانت المنطقة مجروحة أو ملتهبة أو متهيجة بشدة، فمن الأفضل تأجيل الجلسة حتى تهدأ البشرة."]],note:"تختلف طريقة إزالة الشعر بحسب المنطقة وطبيعة البشرة."},

"hydrafacial":{title:"هايدروفيشل",intro:"جلسة عناية للوجه تهدف إلى تنظيف البشرة وترطيبها، وقد تجمع بين التنظيف والتقشير اللطيف واستخلاص الشوائب وفق الجهاز والخطوات المعتمدة.",sections:[["كيف تتم الجلسة؟","تُقيّم البشرة أولاً، ثم تُجرى خطوات التنظيف والعناية المناسبة. تختلف التفاصيل بحسب حالة البشرة والجهاز المستخدم."],["ما الفائدة المتوقعة؟","قد تساعد الجلسة على منح البشرة مظهراً أنظف وأكثر انتعاشاً وترطيباً. وتختلف النتيجة من بشرة إلى أخرى."],["لمن تناسب؟","تُحدّد الملاءمة بعد معرفة نوع البشرة وحساسيتها، ووجود تهيّج أو مشكلات جلدية حالية."],["بعد الجلسة","اتبعي إرشادات العناية التي تحصلين عليها، واستخدمي واقي الشمس وتجنّبي المنتجات القوية إذا أوصت المختصة بذلك."]],note:"إذا كانت بشرتك متهيجة أو لديكِ حالة جلدية، أخبرينا قبل تحديد الموعد."},

"wax-hair-removal":{title:"הסרת שיער בשעווה",intro:"טיפול להסרת שיער מהאזור המבוקש באמצעות שעווה מתאימה, תוך הקפדה על ניקיון העור ונוחותו לפני הטיפול ואחריו.",sections:[["איך מתבצע הטיפול?","מנקים ומייבשים את האזור, מסירים את השיער בשעווה המתאימה לאזור ומסיימים בטיפוח מרגיע לפי הצורך."],["לפני הטיפול","מומלץ להגיע עם עור נקי ויבש. עדכני אותנו אם העור רגיש או אם את משתמשת בתכשירי פילינג."],["אחרי הטיפול","ייתכן אדמומיות קלה וזמנית. מומלץ להימנע לזמן קצר מחום, חיכוך ובישום באזור ולפעול לפי הנחיות המטפלת."],["מתי לדחות?","אם האזור פצוע, מודלק או מגורה מאוד, עדיף לדחות את הטיפול."]],note:"אופן הטיפול עשוי להשתנות בהתאם לאזור ולסוג העור."},

"hydrafacial":{title:"הידרופיישל",intro:"טיפול פנים שמטרתו ניקוי והענקת לחות לעור. בהתאם למכשיר ולמצב העור, הוא עשוי לשלב ניקוי, פילינג עדין והוצאת שאריות.",sections:[["איך מתבצע הטיפול?","מתחילים בהערכת העור, ולאחר מכן מבצעים את שלבי הניקוי והטיפוח המתאימים."],["למה אפשר לצפות?","הטיפול עשוי להעניק לעור מראה נקי ורענן יותר ולחות. התוצאה משתנה מאדם לאדם."],["למי מתאים?","ההתאמה נקבעת לפי סוג העור, רגישותו והאם קיימים גירוי או בעיות עור פעילות."],["לאחר הטיפול","מומלץ לפעול לפי הנחיות המטפלת ולהשתמש בהגנה מהשמש."]],note:"אם העור מגורה או שיש מצב עור פעיל, עדכני אותנו לפני קביעת התור."},
"deep-cleansing":{title:"ניקוי עמוק",intro:"טיפול פנים לניקוי ולטיפוח מראה העור, תוך בחירת השלבים המתאימים לסוג העור ולצרכיו.",sections:[["מה כולל הטיפול?","הטיפול עשוי לכלול ניקוי, הסרת שאריות שטחיות ופילינג עדין, בהתאם להערכת העור."],["מה מטרת הטיפול?","הטיפול מסייע בניקוי ובטיפוח מראה העור תוך התחשבות בסוג העור וברגישותו."],["לפני הטיפול","עדכני אותנו לגבי רגישויות או שימוש בתכשירים פעילים כמו פילינג או רטינול."],["אחרי הטיפול","ייתכן אדמומיות קלה וזמנית. מומלץ לפעול לפי הנחיות הטיפוח ולהשתמש בהגנה מהשמש."]],note:"שלבי הטיפול נבחרים לפי מצב העור."}};
